services:
  tabpaladin-sync:
    container_name: tabpaladin-sync
    build:
      # Build context is the repo root so the Dockerfile can see ../pwa
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18921}:18921"
    volumes:
      - ./data:/data
      # Mount the PWA folder live so changes don't require rebuilds during dev.
      - ../pwa:/app/pwa:ro
    environment:
      - PORT=18921
      - DATA_DIR=/data
      - PWA_DIR=/app/pwa
      # Optional legacy shared token for clients that predate account logins.
      # No default: leave TABPALADIN_TOKEN unset to use logins only. If set it
      # must be at least 32 characters (openssl rand -hex 32) or the server
      # refuses to start.
      - AUTH_TOKEN=${TABPALADIN_TOKEN:-}
      # Optional: create the account at first boot instead of using the setup
      # code printed in the log. Ignored once an account exists.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Which proxies may set X-Forwarded-For / -Proto. The default trusts
      # loopback and private networks (a reverse proxy or tunnel on your LAN).
      - TRUST_PROXY=${TRUST_PROXY:-}
      - MAX_SNAPSHOTS=${MAX_SNAPSHOTS:-200}
      # Encrypts importer OAuth refresh tokens at rest. Set it in .env before
      # connecting an account — sync.db is the kind of file that ends up in a
      # backup, and a Reddit refresh token in there grants access to the account.
      # Changing it later makes existing connections unreadable and they have to
      # be re-authorised.
      - IMPORT_SECRET=${IMPORT_SECRET:-}
