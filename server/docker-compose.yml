services:
  tabpaladin-sync:
    container_name: tabpaladin-sync
    build:
      # Build context is the repo root so the Dockerfile can see ../pwa
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18921}:18921"
    volumes:
      - ./data:/data
      # Mount the PWA folder live so changes don't require rebuilds during dev.
      - ../pwa:/app/pwa:ro
    environment:
      - PORT=18921
      - DATA_DIR=/data
      - PWA_DIR=/app/pwa
      # First admin, created on the first start with no accounts; ignored after.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Optional legacy shared token / script key; acts as the account that
      # owned the data before accounts were separated.
      # Off unless set; at least 32 characters (openssl rand -hex 32).
      - AUTH_TOKEN=${TABPALADIN_TOKEN:-}
      # Proxies allowed to set X-Forwarded-*; default loopback, uniquelocal.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # Extra CORS origins (extensions and this server's own origin always work).
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
      - MAX_SNAPSHOTS=${MAX_SNAPSHOTS:-200}
      # Encrypts importer OAuth refresh tokens at rest. Set it in .env before
      # connecting an account — sync.db is the kind of file that ends up in a
      # backup, and a Reddit refresh token in there grants access to the account.
      # Changing it later makes existing connections unreadable and they have to
      # be re-authorised.
      - IMPORT_SECRET=${IMPORT_SECRET:-}
      # Whose data this is, for the one-time upgrade to separate accounts —
      # only needed when the database already holds more than one account.
      - TENANCY_OWNER=${TENANCY_OWNER:-}
      # "off" stops the import scheduler (for a rehearsal on a copy of a real
      # database, which would otherwise sweep the real Reddit account).
      - IMPORTS_SCHEDULER=${IMPORTS_SCHEDULER:-}
      # Failed sign-ins per IP across all usernames (default 5 x AUTH_MAX_FAILURES).
      - AUTH_IP_MAX_FAILURES=${AUTH_IP_MAX_FAILURES:-}
      # Per-account caps; they refuse new rows and never prune old ones.
      - MAX_INBOX_PER_USER=${MAX_INBOX_PER_USER:-5000}
      - MAX_PROPOSALS_PER_USER=${MAX_PROPOSALS_PER_USER:-200}
