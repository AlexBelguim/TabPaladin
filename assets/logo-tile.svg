<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TabPaladin">
  <defs>
    <linearGradient id="tp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- The installed app's icon (pwa/icons/app*.png, from tools/make_icons.mjs):
       the shield on a tile of the app's own background, with room around it,
