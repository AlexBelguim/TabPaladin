  <g transform="translate(24 24) scale(0.68) translate(-24 -24.25)">
    <path d="M24 2 L44 9 V25 C44 36.5 35 43.5 24 46.5 C13 43.5 4 36.5 4 25 V9 Z"
          fill="url(#tp-tile)"/>
    <rect x="13" y="17.5" width="22" height="5" rx="2.5" fill="#fff" opacity=".96"/>
    <rect x="13" y="26" width="14" height="5" rx="2.5" fill="#fff" opacity=".72"/>
  </g>
</svg>
